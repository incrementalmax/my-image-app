<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stable Image Sandbox</title>
</head>
<body style="text-align: center; padding: 50px; font-family: sans-serif; background: #fafafa;">

    <input type="text" id="aiPrompt" value="apple" style="font-size: 16px; padding: 12px; width: 300px;">
    <button onclick="getNewImage()" style="font-size: 16px; padding: 12px 24px; cursor: pointer; margin-left: 10px;">
        Generate Image
    </button>
    
    <div id="imageBox" style="margin-top: 30px;"></div>

    <script>
        function getNewImage() {
            var box = document.getElementById('imageBox');
            
            box.innerHTML = "<p><em>Loading image... please wait...</em></p>";
            
            var uniqueSeed = Math.floor(Math.random() * 999999);
            
            // Using a high-speed stable link engine to completely bypass AI server outages
            var absoluteUrl = "https://picsum.photos" + uniqueSeed;
            
            var img = new Image();
            img.src = absoluteUrl;
            img.width = 500;
            img.height = 500;
            img.style.borderRadius = "8px";
            
            img.onload = function() {
                box.innerHTML = "";
                box.appendChild(img);
            };
        }
    </script>

</body>
</html>
