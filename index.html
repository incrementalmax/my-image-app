<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure AI Sandbox</title>
</head>
<body style="text-align: center; padding: 50px; font-family: sans-serif; background: #fafafa;">

    <!-- 1. The input bar and trigger button -->
    <input type="text" id="aiPrompt" value="a beautiful fantasy castle" style="font-size: 16px; padding: 12px; width: 300px;">
    <button onclick="getNewImage()" style="font-size: 16px; padding: 12px 24px; cursor: pointer; margin-left: 10px;">
        Generate Image
    </button>
    
    <div id="imageBox" style="margin-top: 30px;"></div>

    <script>
        function getNewImage() {
            var box = document.getElementById('imageBox');
            var rawText = document.getElementById('aiPrompt').value;
            
            box.innerHTML = "<p><em>The AI is drawing... please wait...</em></p>";
            
            var uniqueSeed = Math.floor(Math.random() * 999999);
            var safeText = encodeURIComponent(rawText);
            
            // Safe, direct image source URL layout
            var absoluteUrl = "https://pollinations.ai" + safeText + "?width=500&height=500&nologo=true&seed=" + uniqueSeed;
            
            // We create a fresh image element and attach a 'crossOrigin' safety key
            var img = new Image();
            img.crossOrigin = "anonymous"; 
            img.src = absoluteUrl;
            img.width = 500;
            img.height = 500;
            img.style.borderRadius = "8px";
            
            // Only drop it onto the page the exact millisecond it finishes downloading completely
            img.onload = function() {
                box.innerHTML = "";
                box.appendChild(img);
            };
        }
    </script>

</body>
</html>
